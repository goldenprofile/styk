name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uv tool install --python 3.12 .
      - run: echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: styk --help
      - name: Run demo
        run: |
          demo_dir=$(mktemp -d)
          styk --workspace "$demo_dir" run examples/demo.json
          styk --workspace "$demo_dir" status
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: integrations/pi/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: integrations/pi
      - run: npm run typecheck
        working-directory: integrations/pi
      - run: npm test
        timeout-minutes: 2
        working-directory: integrations/pi
